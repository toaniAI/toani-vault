[package]
name = "vault-service"
version = "0.1.0"
edition = "2024"

[lib]
doctest = false

[dependencies]
# 加密库
ring = "0.17"
aes-gcm = "0.10"
rand = "0.8"
sodiumoxide = "0.2"
subtle = "2.5"
constant_time_eq = "0.3"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }

# HMAC 和 SHA2
hmac = "0.12"
sha2 = "0.10"

# PNG 操作
png = "0.17"

# 图像处理
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }

# Chrome DevTools Protocol
chromiumoxide = { version = "0.7", features = ["tokio-runtime"], optional = true }

# CSV 处理
csv = "1.3"

# 编码
base64 = "0.22"
hex = "0.4"

# 内存安全
zeroize = { version = "1.8", features = ["derive"] }

# 密码哈希
bcrypt = "0.15"

# 日志
log = "0.4"

# 错误处理
thiserror = "1.0"

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 正则表达式
regex = "1.10"

# 类型工具
derive_more = { version = "1.0", features = ["display"] }

# UUID（v4/v7 时间排序）
uuid = { version = "1.7", features = ["v4", "v7", "serde"] }

# Time with serde (锁定到兼容 Rust 1.85 的版本)
time = { version = "=0.3.36", features = ["serde"] }

# PASETO Token (降级到兼容 Rust 1.85 的版本)
pasetors = { version = "=0.6.8", features = ["v4"] }

# HTTP API 框架（Axum）
axum = { version = "0.7", features = ["json", "macros", "ws"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
http = "1.0"
http-body-util = "0.1"

# Vault 客户端
vaultrs = "0.7"
reqwest = { version = "0.12", features = ["json"] }

# Redis 客户端
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# PostgreSQL 数据库
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-native-tls", "postgres", "uuid", "chrono", "json"] }

# 配置管理
config = "0.14"

# 异步 trait
async-trait = "0.1"

# 全局单例
once_cell = "1.19"

# Futures 工具
futures = "0.3"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 日期时间
chrono = { version = "0.4", features = ["serde"] }

# 锁定传递依赖版本以兼容 Rust 1.85
home = "=0.5.9"
orion = "=0.17.8"

# 系统调用
libc = "0.2"

# 异步运行时
tokio = { version = "1", features = ["full", "rt-multi-thread"] }

# TLS 支持（用于 HTTPS 连接）
tokio-rustls = "0.26"
rustls = "0.23"
webpki-roots = "0.26"

# macOS Keychain 支持（仅 macOS）
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2.11"

[features]
default = ["screenshot-cdp"]
# 严格生产模式：禁止调试功能
strict-production = []
# 允许调试模式（即使在发布构建中）
allow-debug = []
# RLS 集成测试（需要数据库连接）
rls-tests = []
# RLS 性能基准测试
rls-benchmark = []
# 截图 CDP 支持（使用 chromiumoxide）
screenshot-cdp = ["chromiumoxide"]

[[test]]
name = "paseto_tests"
path = "tests/token/paseto_tests.rs"

[[test]]
name = "redis_store_tests"
path = "tests/token/redis_store_tests.rs"
required-features = []

[[test]]
name = "scope_tests"
path = "tests/token/scope_tests.rs"

[[test]]
name = "audit_events_tests"
path = "tests/audit/events_tests.rs"

[[test]]
name = "immudb_tests"
path = "tests/audit/immudb_tests.rs"

[[test]]
name = "audit_api_tests"
path = "tests/api/audit_tests.rs"

[[test]]
name = "tenant_middleware_tests"
path = "tests/api/tenant_middleware_tests.rs"

[[test]]
name = "tenant_config_tests"
path = "tests/tenant/config_tests.rs"

[[test]]
name = "dcap_tests"
path = "tests/tee/dcap_tests.rs"

[[test]]
name = "attestation_api_tests"
path = "tests/api/attestation_tests.rs"

[[test]]
name = "rls_integration"
path = "tests/rls_integration.rs"
required-features = []

[[test]]
name = "sandbox_export_tests"
path = "tests/tee/sandbox_export_tests.rs"

[[test]]
name = "sandbox_performance"
path = "tests/tee/sandbox_performance.rs"
