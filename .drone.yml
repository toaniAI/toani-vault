# CredBridge backend CI/CD
# 业务系统模式: zkme 集群, dev/test 双环境

---
kind: pipeline
type: docker
name: backend-testing

trigger:
  ref:
    include:
      - refs/heads/branch_dev
      - refs/heads/branch_test
  event:
    - push
    - pull_request
  paths:
    exclude:
      - frontend/**

steps:
  - name: cargo-fetch
    image: hub.bitkinetic.com/public/rust:1.75-bullseye
    pull: if-not-exists
    commands:
      - cargo fetch

  - name: rust-fmt
    image: hub.bitkinetic.com/public/rust:1.75-bullseye
    pull: if-not-exists
    depends_on:
      - cargo-fetch
    commands:
      - cargo fmt --all -- --check

  - name: rust-clippy
    image: hub.bitkinetic.com/public/rust:1.75-bullseye
    pull: if-not-exists
    depends_on:
      - cargo-fetch
    commands:
      - cargo clippy --all-targets -- -D warnings

  - name: unit-tests
    image: hub.bitkinetic.com/public/rust:1.75-bullseye
    pull: if-not-exists
    depends_on:
      - rust-fmt
      - rust-clippy
    commands:
      - cargo test --release

---
kind: pipeline
type: docker
name: backend-build-deploy
depends_on:
  - backend-testing

trigger:
  ref:
    - refs/heads/branch_dev
    - refs/heads/branch_test
  event:
    - push
  paths:
    exclude:
      - frontend/**

steps:
  - name: docker-build
    image: plugins/docker
    pull: if-not-exists
    settings:
      registry: hub.bitkinetic.com
      repo: hub.bitkinetic.com/zkme/credbridge
      tags: alpha-${DRONE_BUILD_NUMBER}
      purge: true
      username:
        from_secret: docker-hub-username
      password:
        from_secret: docker-hub-password
      context: ./
      dockerfile: Dockerfile

  - name: deploy-dev
    image: tttlkkkl/drone-helm:v6
    pull: if-not-exists
    depends_on:
      - docker-build
    environment:
      KUBECTL_CONFIG:
        from_secret: kube-config
      REPO_USER:
        from_secret: docker-hub-username
      REPO_PWD:
        from_secret: docker-hub-password
    commands:
      - /run.sh
      - helm repo add --username=$REPO_USER --password=$REPO_PWD dn https://charts.bitkinetic.com/
      - kubectl create --save-config configmap credbridge-go -n zkme-dev --from-file config/dev/config.yaml -o yaml --dry-run=client | kubectl apply -f -
      - helm upgrade --install credbridge-go dn/go -f .values.yaml -n zkme-dev --set image.tag=alpha-${DRONE_BUILD_NUMBER}
      - kubectl -n zkme-dev rollout status deployment/credbridge-go --timeout=600s
    when:
      ref:
        - refs/heads/branch_dev

  - name: deploy-test
    image: tttlkkkl/drone-helm:v6
    pull: if-not-exists
    depends_on:
      - docker-build
    environment:
      KUBECTL_CONFIG:
        from_secret: kube-config
      REPO_USER:
        from_secret: docker-hub-username
      REPO_PWD:
        from_secret: docker-hub-password
    commands:
      - /run.sh
      - helm repo add --username=$REPO_USER --password=$REPO_PWD dn https://charts.bitkinetic.com/
      - kubectl create --save-config configmap credbridge-go -n zkme-test --from-file config/test/config.yaml -o yaml --dry-run=client | kubectl apply -f -
      - helm upgrade --install credbridge-go dn/go -f .test.values.yaml -n zkme-test --set image.tag=alpha-${DRONE_BUILD_NUMBER}
      - kubectl -n zkme-test rollout status deployment/credbridge-go --timeout=600s
    when:
      ref:
        - refs/heads/branch_test

---
kind: secret
name: docker-hub-username
get:
  path: docker-secret-hub.bitkinetic.com
  name: username

---
kind: secret
name: docker-hub-password
get:
  path: docker-secret-hub.bitkinetic.com
  name: password

---
kind: secret
name: kube-config
get:
  path: drone-helm-secret
  name: config
