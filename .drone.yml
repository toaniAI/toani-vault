kind: pipeline
type: docker
name: backend-verification

trigger:
  event:
    - pull_request
    - push

steps:
  - name: cargo-fetch
    image: rust:1.88.0-slim-bookworm
    pull: if-not-exists
    commands:
      - apt-get update && apt-get install -y libssl-dev pkg-config protobuf-compiler libsodium-dev cmake build-essential
      - cargo fetch

  - name: rust-fmt
    image: rust:1.88.0-slim-bookworm
    pull: if-not-exists
    depends_on:
      - cargo-fetch
    commands:
      - rustup component add rustfmt
      - cargo fmt --check

  - name: rust-clippy
    image: rust:1.88.0-slim-bookworm
    pull: if-not-exists
    depends_on:
      - cargo-fetch
    commands:
      - rustup component add clippy
      - cargo clippy --tests -- -D warnings

  - name: rust-test
    image: rust:1.88.0-slim-bookworm
    pull: if-not-exists
    depends_on:
      - cargo-fetch
    commands:
      - cargo test

---
kind: pipeline
type: docker
name: hardware-attestation-template

trigger:
  event:
    - cron
  cron:
    - hardware-attestation-template

steps:
  - name: sgx-enclave-build
    image: rust:1.88.0-slim-bookworm
    pull: if-not-exists
    environment:
      TEE_MODE: hardware
      DCAP_PCCS_URL: https://pccs.example.com/sgx/certification/v4/
      SGX_SIGNING_KEY:
        from_secret: sgx-signing-key
    commands:
      - apt-get update && apt-get install -y libssl-dev pkg-config protobuf-compiler libsodium-dev cmake build-essential
      - bash scripts/check_sgx_environment.sh
      - bash scripts/build-sgx-enclave.sh
      - bash scripts/sign-sgx-enclave.sh
      - cargo test --features tee-hardware --lib --tests --no-run

---
kind: pipeline
type: docker
name: container-build-template

trigger:
  event:
    - tag

steps:
  - name: verify-nsjail-runtime-contract
    image: alpine:3.21
    pull: if-not-exists
    commands:
      - test -f nsjail-3.6.tar.gz
      - sh docker/scripts/verify-nsjail-runtime-contract.sh

  - name: docker-build-template
    image: plugins/docker
    pull: if-not-exists
    depends_on:
      - verify-nsjail-runtime-contract
    settings:
      registry: registry.example.com
      repo: registry.example.com/example-org/credbridge
      dockerfile: Dockerfile
      tags:
        - ${DRONE_TAG}
      purge: true
      username:
        from_secret: public-registry-username
      password:
        from_secret: public-registry-password
      build_args:
        - BASE_BUILDER_IMAGE=ghcr.io/example-org/credbridge-builder:latest
        - RUNTIME_BASE_IMAGE=ghcr.io/example-org/credbridge-runtime-sandbox:latest
        - SGX_SIGNING_KEY=${SGX_SIGNING_KEY}

  - name: helm-package-template
    image: alpine/helm:3.16.3
    pull: if-not-exists
    depends_on:
      - docker-build-template
    commands:
      - CHART_VERSION="${DRONE_TAG#v}"
      - helm package config/chart --version "$CHART_VERSION"
      - echo "Push the packaged chart to your public OCI registry in a downstream release job."
