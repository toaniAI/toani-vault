kind: pipeline
type: docker
name: backend-testing
environment:
  CREDBRIDGE_AUDIT_ALLOW_MEMORY_FALLBACK: "true"

trigger:
  ref:
    include:
      - refs/heads/branch_dev
      - refs/heads/branch_test
      - refs/pull/**
  event:
    # PR 常规门禁：所有日常开发至少执行 fmt/clippy/test
    - pull_request
    - push
    # 保留 cron，便于定时回归
    - cron
  paths:
    exclude:
      - frontend/**

services:
  - name: redis
    image: redis:7-alpine
    ports:
      - 6379

steps:
  - name: cargo-fetch
    image: rust:1.88.0-slim-bookworm
    pull: if-not-exists
    commands:
      - apt-get update && apt-get install -y libssl-dev pkg-config protobuf-compiler libsodium-dev cmake build-essential
      - cargo fetch

  - name: rust-fmt
    image: rust:1.88.0-slim-bookworm
    pull: if-not-exists
    depends_on:
      - cargo-fetch
    commands:
      - apt-get update && apt-get install -y libssl-dev pkg-config protobuf-compiler libsodium-dev cmake build-essential
      - rustup component add rustfmt
      - cargo fmt --check

  - name: rust-clippy
    image: rust:1.88.0-slim-bookworm
    pull: if-not-exists
    depends_on:
      - cargo-fetch
    commands:
      - apt-get update && apt-get install -y libssl-dev pkg-config protobuf-compiler libsodium-dev cmake build-essential
      - rustup component add clippy
      - cargo clippy --tests -- -D warnings

  - name: simulation-safe-tests
    image: rust:1.88.0-slim-bookworm
    pull: if-not-exists
    depends_on:
      - rust-fmt
      - rust-clippy
    environment:
      REDIS_URL: redis://redis:6379
      TEE_MODE: simulation
    commands:
      - apt-get update && apt-get install -y libssl-dev pkg-config protobuf-compiler libsodium-dev cmake build-essential
      - cargo test

---
kind: pipeline
type: docker
name: backend-hardware-attestation
environment:
  CREDBRIDGE_AUDIT_ALLOW_MEMORY_FALLBACK: "true"

trigger:
  event:
    - cron
  cron:
    - hardware-attestation
  paths:
    include:
      - src/**
      - tests/**
      - .drone.yml

node:
  tee_runner: sgx

steps:
  - name: sgx-enclave-build
    image: rust:1.88.0-slim-bookworm
    pull: if-not-exists
    environment:
      TEE_MODE: hardware
      DCAP_PCCS_URL: https://sgx-dcap-server-vpc.cn-hongkong.aliyuncs.com/sgx/certification/v4/
      SGX_SIGNING_KEY:
        from_secret: sgx-signing-key
    commands:
      - apt-get update && apt-get install -y libssl-dev pkg-config protobuf-compiler libsodium-dev cmake build-essential
      - bash scripts/check_sgx_environment.sh
      - bash scripts/build-sgx-enclave.sh
      - bash scripts/sign-sgx-enclave.sh

  - name: hardware-compile-check
    image: rust:1.88.0-slim-bookworm
    pull: if-not-exists
    depends_on:
      - sgx-enclave-build
    environment:
      TEE_MODE: hardware
      DCAP_PCCS_URL: https://sgx-dcap-server-vpc.cn-hongkong.aliyuncs.com/sgx/certification/v4/
      TEE_ENCLAVE_PATH: /drone/src/target/sgx-enclave/credbridge_enclave.signed.so
    commands:
      - apt-get update && apt-get install -y libssl-dev pkg-config protobuf-compiler libsodium-dev cmake build-essential
      - cargo test --features tee-hardware --lib --tests --no-run

  - name: hardware-only-tests
    image: rust:1.88.0-slim-bookworm
    pull: if-not-exists
    depends_on:
      - hardware-compile-check
    environment:
      TEE_MODE: hardware
      DCAP_PCCS_URL: https://sgx-dcap-server-vpc.cn-hongkong.aliyuncs.com/sgx/certification/v4/
      TEE_ENCLAVE_PATH: /drone/src/target/sgx-enclave/credbridge_enclave.signed.so
    commands:
      - apt-get update && apt-get install -y libssl-dev pkg-config protobuf-compiler libsodium-dev cmake build-essential
      - cargo test --features tee-hardware --test sgx_hardware_tests -- --ignored --test-threads=1

---
kind: pipeline
type: docker
name: backend-build-deploy
environment:
  DOCKER_BUILDKIT: "1"
  DOCKER_HOST: tcp://docker:2375
  SGX_RUNTIME_BASE_REPO: hub.bitkinetic.com/zkme/credbridge-runtime-sandbox
  SGX_RUNTIME_BASE_TAG: jammy-sgx2.28.100.1-nsjail3.6
  APP_IMAGE_REPO: hub.bitkinetic.com/zkme/credbridge
trigger:
  ref:
    - refs/heads/branch_dev
    - refs/heads/branch_test
  event:
    - push
  paths:
    exclude:
      - frontend/**

services:
  - name: docker
    image: docker:27-dind
    privileged: true
    command:
      - --host=tcp://0.0.0.0:2375
      - --tls=false

steps:
  - name: verify-nsjail-archive
    image: alpine:3.21
    pull: if-not-exists
    commands:
      - test -f nsjail-3.6.tar.gz

  - name: ensure-runtime-base-image
    image: docker:27-cli
    pull: if-not-exists
    depends_on:
      - verify-nsjail-archive
    environment:
      REPO_USER:
        from_secret: docker-hub-username
      REPO_PWD:
        from_secret: docker-hub-password
    commands:
      - |
        sh -eu -c '
          runtime_base_image="${SGX_RUNTIME_BASE_REPO}:${SGX_RUNTIME_BASE_TAG}"

          until docker info >/dev/null 2>&1; do
            sleep 1
          done

          echo "$REPO_PWD" | docker login hub.bitkinetic.com -u "$REPO_USER" --password-stdin

          if docker manifest inspect "$runtime_base_image" >/dev/null 2>&1; then
            echo "runtime base image already exists: $runtime_base_image"
            exit 0
          fi

          docker build \
            -f docker/base/runtime.Dockerfile \
            -t "$runtime_base_image" \
            .

          docker push "$runtime_base_image"
        '

  - name: docker-build
    image: docker:27-cli
    pull: if-not-exists
    depends_on:
      - ensure-runtime-base-image
    environment:
      REPO_USER:
        from_secret: docker-hub-username
      REPO_PWD:
        from_secret: docker-hub-password
      SGX_SIGNING_KEY:
        from_secret: sgx-signing-key
    commands:
      - |
        sh -eu -c '
          runtime_base_image="${SGX_RUNTIME_BASE_REPO}:${SGX_RUNTIME_BASE_TAG}"
          app_image="${APP_IMAGE_REPO}:alpha-${DRONE_BUILD_NUMBER}"

          until docker info >/dev/null 2>&1; do
            sleep 1
          done

          echo "$REPO_PWD" | docker login hub.bitkinetic.com -u "$REPO_USER" --password-stdin

          docker build \
            --build-arg SGX_SIGNING_KEY="$SGX_SIGNING_KEY" \
            --build-arg RUNTIME_BASE_IMAGE="$runtime_base_image" \
            -f Dockerfile \
            -t "$app_image" \
            .

          docker push "$app_image"
        '

  - name: deploy-dev
    image: tttlkkkl/drone-helm:v6
    pull: if-not-exists
    depends_on:
      - docker-build
    environment:
      KUBECTL_CONFIG:
        from_secret: kube-config
      REPO_USER:
        from_secret: docker-hub-username
      REPO_PWD:
        from_secret: docker-hub-password
      PRIVY_APP_SECRET_RAW:
        from_secret: privy-app-secret
      PRIVY_APP_SECRET_ALT:
        from_secret: PRIVY_APP_SECRET
    commands:
      - /run.sh
      - helm repo add --username=$REPO_USER --password=$REPO_PWD dn https://charts.bitkinetic.com/
      - kubectl create --save-config configmap credbridge -n zkme-dev --from-file config/dev/config.yaml -o yaml --dry-run=client | kubectl apply -f -
      - |
        sh -eu -c '
          PRIVY_APP_ID="cmniaifov006t0cl1af6l5xqs"
          PRIVY_APP_SECRET="$${PRIVY_APP_SECRET_RAW:-$${PRIVY_APP_SECRET_ALT:-}}"

          {
            printf "%s\n" "envs:"
            printf "%s\n" "  PRIVY_JWKS_URL: \"https://auth.privy.io/api/v1/apps/$${PRIVY_APP_ID}/jwks.json\""
            printf "%s\n" "  PRIVY_API_URL: \"https://auth.privy.io/api/v1\""

            if [ -n "$$PRIVY_APP_ID" ]; then
              printf "  PRIVY_APP_ID: \"%s\"\n" "$$PRIVY_APP_ID"
            fi

            if [ -n "$$PRIVY_APP_SECRET" ]; then
              printf "  PRIVY_APP_SECRET: \"%s\"\n" "$$PRIVY_APP_SECRET"
            fi
          } > .drone-runtime.values.yaml
        '
      - helm upgrade --install credbridge dn/go -f .values.yaml -f .drone-runtime.values.yaml -n zkme-dev --set image.tag=alpha-${DRONE_BUILD_NUMBER}
      - kubectl -n zkme-dev rollout status deployment/credbridge-go --timeout=600s
    when:
      ref:
        - refs/heads/branch_dev

  - name: notify-lark-deploy-dev
    image: curlimages/curl:8.12.1
    pull: if-not-exists
    depends_on:
      - deploy-dev
    commands:
      - |
        sh -eu -c '
          commit_message=$(printf "%s" "${DRONE_COMMIT_MESSAGE:-}" \
            | tr "\r\n" "  " \
            | sed "s/\\\\/\\\\\\\\/g; s/\\\"/\\\\\\\"/g")

          printf "%s" \
            "{\"msg_type\":\"text\",\"content\":{\"text\":\"部署\nCredBridge dev 部署成功\n仓库: ${DRONE_REPO}\n分支: ${DRONE_BRANCH}\n构建号: ${DRONE_BUILD_NUMBER}\n提交: ${DRONE_COMMIT_SHA}\n提交说明: ${commit_message}\n链接: ${DRONE_BUILD_LINK}\"}}" \
            | curl -fsSL -X POST -H "Content-Type: application/json" \
                --data-binary @- \
                https://open.larksuite.com/open-apis/bot/v2/hook/7c903754-0db9-46bc-a363-03184c024bdb
        '
    when:
      ref:
        - refs/heads/branch_dev

  - name: deploy-test
    image: tttlkkkl/drone-helm:v6
    pull: if-not-exists
    depends_on:
      - docker-build
    environment:
      KUBECTL_CONFIG:
        from_secret: kube-config
      REPO_USER:
        from_secret: docker-hub-username
      REPO_PWD:
        from_secret: docker-hub-password
      PRIVY_APP_SECRET_RAW:
        from_secret: privy-app-secret
      PRIVY_APP_SECRET_ALT:
        from_secret: PRIVY_APP_SECRET
    commands:
      - /run.sh
      - helm repo add --username=$REPO_USER --password=$REPO_PWD dn https://charts.bitkinetic.com/
      - kubectl create --save-config configmap credbridge -n zkme-test --from-file config/test/config.yaml -o yaml --dry-run=client | kubectl apply -f -
      - |
        sh -eu -c '
          PRIVY_APP_ID="cmniaifov006t0cl1af6l5xqs"
          PRIVY_APP_SECRET="$${PRIVY_APP_SECRET_RAW:-$${PRIVY_APP_SECRET_ALT:-}}"

          {
            printf "%s\n" "envs:"
            printf "%s\n" "  PRIVY_JWKS_URL: \"https://auth.privy.io/api/v1/apps/$${PRIVY_APP_ID}/jwks.json\""
            printf "%s\n" "  PRIVY_API_URL: \"https://auth.privy.io/api/v1\""

            if [ -n "$$PRIVY_APP_ID" ]; then
              printf "  PRIVY_APP_ID: \"%s\"\n" "$$PRIVY_APP_ID"
            fi

            if [ -n "$$PRIVY_APP_SECRET" ]; then
              printf "  PRIVY_APP_SECRET: \"%s\"\n" "$$PRIVY_APP_SECRET"
            fi
          } > .drone-runtime.values.yaml
        '
      - helm upgrade --install credbridge dn/go -f .test.values.yaml -f .drone-runtime.values.yaml -n zkme-test --set image.tag=alpha-${DRONE_BUILD_NUMBER}
      - kubectl -n zkme-test rollout status deployment/credbridge-go --timeout=600s
    when:
      ref:
        - refs/heads/branch_test

---
kind: secret
name: sgx-signing-key
get:
  path: sgx-signing-key
  name: key

---
kind: secret
name: docker-hub-username
get:
  path: docker-secret-hub.bitkinetic.com
  name: username

---
kind: secret
name: docker-hub-password
get:
  path: docker-secret-hub.bitkinetic.com
  name: password

---
kind: secret
name: kube-config
get:
  path: drone-helm-secret
  name: config

---
kind: secret
name: privy-app-id
get:
  path: credbridge-privy
  name: PRIVY_APP_ID

---
kind: secret
name: privy-app-secret
get:
  path: credbridge-privy
  name: PRIVY_APP_SECRET

---
kind: secret
name: PRIVY_APP_ID
get:
  path: credbridge-privy
  name: PRIVY_APP_ID

---
kind: secret
name: PRIVY_APP_SECRET
get:
  path: credbridge-privy
  name: PRIVY_APP_SECRET
