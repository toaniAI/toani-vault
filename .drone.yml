kind: pipeline
type: docker
name: backend-testing
environment:
  CREDBRIDGE_AUDIT_ALLOW_MEMORY_FALLBACK: "true"

trigger:
  ref:
    include:
      - refs/heads/branch_dev
      - refs/heads/branch_test
      - refs/pull/**
  event:
    # PR 常规门禁：所有日常开发至少执行 fmt/clippy/test
    - pull_request
    - push
    # 保留 cron，便于定时回归
    - cron
  paths:
    exclude:
      - frontend/**

services:
  - name: redis
    image: redis:7-alpine
    ports:
      - 6379

steps:
  - name: cargo-fetch
    image: rust:1.88.0-slim-bookworm
    pull: if-not-exists
    commands:
      - apt-get update && apt-get install -y libssl-dev pkg-config protobuf-compiler libsodium-dev cmake build-essential
      - cargo fetch

  - name: rust-fmt
    image: rust:1.88.0-slim-bookworm
    pull: if-not-exists
    depends_on:
      - cargo-fetch
    commands:
      - apt-get update && apt-get install -y libssl-dev pkg-config protobuf-compiler libsodium-dev cmake build-essential
      - rustup component add rustfmt
      - cargo fmt --check

  - name: rust-clippy
    image: rust:1.88.0-slim-bookworm
    pull: if-not-exists
    depends_on:
      - cargo-fetch
    commands:
      - apt-get update && apt-get install -y libssl-dev pkg-config protobuf-compiler libsodium-dev cmake build-essential
      - rustup component add clippy
      - cargo clippy --tests -- -D warnings

  - name: simulation-safe-tests
    image: rust:1.88.0-slim-bookworm
    pull: if-not-exists
    depends_on:
      - rust-fmt
      - rust-clippy
    environment:
      REDIS_URL: redis://redis:6379
      TEE_MODE: simulation
    commands:
      - apt-get update && apt-get install -y libssl-dev pkg-config protobuf-compiler libsodium-dev cmake build-essential
      - cargo test

---
kind: pipeline
type: docker
name: backend-hardware-attestation
environment:
  CREDBRIDGE_AUDIT_ALLOW_MEMORY_FALLBACK: "true"

trigger:
  event:
    - cron
  cron:
    - hardware-attestation
  paths:
    include:
      - src/**
      - tests/**
      - .drone.yml

node:
  tee_runner: sgx

steps:
  - name: sgx-enclave-build
    image: rust:1.88.0-slim-bookworm
    pull: if-not-exists
    environment:
      TEE_MODE: hardware
      DCAP_PCCS_URL: https://sgx-dcap-server-vpc.cn-hongkong.aliyuncs.com/sgx/certification/v4/
      SGX_SIGNING_KEY:
        from_secret: sgx-signing-key
    commands:
      - apt-get update && apt-get install -y libssl-dev pkg-config protobuf-compiler libsodium-dev cmake build-essential
      - bash scripts/check_sgx_environment.sh
      - bash scripts/build-sgx-enclave.sh
      - bash scripts/sign-sgx-enclave.sh

  - name: hardware-compile-check
    image: rust:1.88.0-slim-bookworm
    pull: if-not-exists
    depends_on:
      - sgx-enclave-build
    environment:
      TEE_MODE: hardware
      DCAP_PCCS_URL: https://sgx-dcap-server-vpc.cn-hongkong.aliyuncs.com/sgx/certification/v4/
      TEE_ENCLAVE_PATH: /drone/src/target/sgx-enclave/credbridge_enclave.signed.so
    commands:
      - apt-get update && apt-get install -y libssl-dev pkg-config protobuf-compiler libsodium-dev cmake build-essential
      - cargo test --features tee-hardware --lib --tests --no-run

  - name: hardware-only-tests
    image: rust:1.88.0-slim-bookworm
    pull: if-not-exists
    depends_on:
      - hardware-compile-check
    environment:
      TEE_MODE: hardware
      DCAP_PCCS_URL: https://sgx-dcap-server-vpc.cn-hongkong.aliyuncs.com/sgx/certification/v4/
      TEE_ENCLAVE_PATH: /drone/src/target/sgx-enclave/credbridge_enclave.signed.so
    commands:
      - apt-get update && apt-get install -y libssl-dev pkg-config protobuf-compiler libsodium-dev cmake build-essential
      - cargo test --features tee-hardware --test sgx_hardware_tests -- --ignored --test-threads=1

---
kind: pipeline
type: docker
name: backend-build-deploy
trigger:
  ref:
    - refs/heads/branch_dev
    - refs/heads/branch_test
  event:
    - push
  paths:
    exclude:
      - frontend/**

steps:
  - name: docker-builder-base
    image: plugins/docker
    pull: if-not-exists
    settings:
      registry: hub.bitkinetic.com
      repo: hub.bitkinetic.com/zkme/credbridge-builder-base
      tags:
        - rust-1.88.0-sgx-2.28.100.1
        - latest
      cache_from:
        - hub.bitkinetic.com/zkme/credbridge-builder-base:rust-1.88.0-sgx-2.28.100.1
        - hub.bitkinetic.com/zkme/credbridge-builder-base:latest
      compress: true
      purge: true
      username:
        from_secret: docker-hub-username
      password:
        from_secret: docker-hub-password
      context: ./
      dockerfile: docker/base/builder.Dockerfile

  - name: docker-runtime-base
    image: plugins/docker
    pull: if-not-exists
    settings:
      registry: hub.bitkinetic.com
      repo: hub.bitkinetic.com/zkme/credbridge-runtime-base
      tags:
        - ubuntu22.04-sgx-2.28.100.1
        - latest
      cache_from:
        - hub.bitkinetic.com/zkme/credbridge-runtime-base:ubuntu22.04-sgx-2.28.100.1
        - hub.bitkinetic.com/zkme/credbridge-runtime-base:latest
      compress: true
      purge: true
      username:
        from_secret: docker-hub-username
      password:
        from_secret: docker-hub-password
      context: ./
      dockerfile: docker/base/runtime.Dockerfile

  - name: docker-build
    image: plugins/docker
    pull: if-not-exists
    depends_on:
      - docker-builder-base
      - docker-runtime-base
    environment:
      SGX_SIGNING_KEY:
        from_secret: sgx-signing-key
    settings:
      registry: hub.bitkinetic.com
      repo: hub.bitkinetic.com/zkme/credbridge
      tags:
        - alpha-${DRONE_BUILD_NUMBER}
        - ${DRONE_BRANCH}-cache
        - buildcache
      cache_from:
        - hub.bitkinetic.com/zkme/credbridge:${DRONE_BRANCH}-cache
        - hub.bitkinetic.com/zkme/credbridge:buildcache
      compress: true
      purge: true
      username:
        from_secret: docker-hub-username
      password:
        from_secret: docker-hub-password
      context: ./
      dockerfile: Dockerfile
      build_args:
        - BASE_BUILDER_IMAGE=hub.bitkinetic.com/zkme/credbridge-builder-base:rust-1.88.0-sgx-2.28.100.1
        - BASE_RUNTIME_IMAGE=hub.bitkinetic.com/zkme/credbridge-runtime-base:ubuntu22.04-sgx-2.28.100.1
      build_args_from_env:
        - SGX_SIGNING_KEY

  - name: deploy-dev
    image: tttlkkkl/drone-helm:v6
    pull: if-not-exists
    depends_on:
      - docker-build
    environment:
      KUBECTL_CONFIG:
        from_secret: kube-config
      REPO_USER:
        from_secret: docker-hub-username
      REPO_PWD:
        from_secret: docker-hub-password
      PRIVY_APP_ID_RAW:
        from_secret: privy-app-id
      PRIVY_APP_SECRET_RAW:
        from_secret: privy-app-secret
      PRIVY_APP_ID_ALT:
        from_secret: PRIVY_APP_ID
      PRIVY_APP_SECRET_ALT:
        from_secret: PRIVY_APP_SECRET
    commands:
      - /run.sh
      - helm repo add --username=$REPO_USER --password=$REPO_PWD dn https://charts.bitkinetic.com/
      - kubectl create --save-config configmap credbridge -n zkme-dev --from-file config/dev/config.yaml -o yaml --dry-run=client | kubectl apply -f -
      - export PRIVY_APP_ID="${PRIVY_APP_ID_RAW:-${PRIVY_APP_ID_ALT:-}}"
      - export PRIVY_APP_SECRET="${PRIVY_APP_SECRET_RAW:-${PRIVY_APP_SECRET_ALT:-}}"
      - test -n "$PRIVY_APP_ID" || (echo "PRIVY_APP_ID is empty; check Drone secret privy-app-id or PRIVY_APP_ID" && exit 1)
      - test -n "$PRIVY_APP_SECRET" || (echo "PRIVY_APP_SECRET is empty; check Drone secret privy-app-secret or PRIVY_APP_SECRET" && exit 1)
      - |
        cat > .drone-runtime.values.yaml <<EOF
        envs:
          PRIVY_APP_ID: "${PRIVY_APP_ID}"
          PRIVY_APP_SECRET: "${PRIVY_APP_SECRET}"
          PRIVY_JWKS_URL: "https://auth.privy.io/api/v1/sessions/jwks.json"
          PRIVY_API_URL: "https://auth.privy.io/api/v1"
          PRIVY_MOCK_ENABLED: "false"
        EOF
      - helm upgrade --install credbridge dn/go -f .values.yaml -f .drone-runtime.values.yaml -n zkme-dev --set image.tag=alpha-${DRONE_BUILD_NUMBER}
      - kubectl -n zkme-dev rollout status deployment/credbridge-go --timeout=600s
    when:
      ref:
        - refs/heads/branch_dev

  - name: deploy-test
    image: tttlkkkl/drone-helm:v6
    pull: if-not-exists
    depends_on:
      - docker-build
    environment:
      KUBECTL_CONFIG:
        from_secret: kube-config
      REPO_USER:
        from_secret: docker-hub-username
      REPO_PWD:
        from_secret: docker-hub-password
      PRIVY_APP_ID_RAW:
        from_secret: privy-app-id
      PRIVY_APP_SECRET_RAW:
        from_secret: privy-app-secret
      PRIVY_APP_ID_ALT:
        from_secret: PRIVY_APP_ID
      PRIVY_APP_SECRET_ALT:
        from_secret: PRIVY_APP_SECRET
    commands:
      - /run.sh
      - helm repo add --username=$REPO_USER --password=$REPO_PWD dn https://charts.bitkinetic.com/
      - kubectl create --save-config configmap credbridge -n zkme-test --from-file config/test/config.yaml -o yaml --dry-run=client | kubectl apply -f -
      - export PRIVY_APP_ID="${PRIVY_APP_ID_RAW:-${PRIVY_APP_ID_ALT:-}}"
      - export PRIVY_APP_SECRET="${PRIVY_APP_SECRET_RAW:-${PRIVY_APP_SECRET_ALT:-}}"
      - test -n "$PRIVY_APP_ID" || (echo "PRIVY_APP_ID is empty; check Drone secret privy-app-id or PRIVY_APP_ID" && exit 1)
      - test -n "$PRIVY_APP_SECRET" || (echo "PRIVY_APP_SECRET is empty; check Drone secret privy-app-secret or PRIVY_APP_SECRET" && exit 1)
      - |
        cat > .drone-runtime.values.yaml <<EOF
        envs:
          PRIVY_APP_ID: "${PRIVY_APP_ID}"
          PRIVY_APP_SECRET: "${PRIVY_APP_SECRET}"
          PRIVY_JWKS_URL: "https://auth.privy.io/api/v1/sessions/jwks.json"
          PRIVY_API_URL: "https://auth.privy.io/api/v1"
          PRIVY_MOCK_ENABLED: "false"
        EOF
      - helm upgrade --install credbridge dn/go -f .test.values.yaml -f .drone-runtime.values.yaml -n zkme-test --set image.tag=alpha-${DRONE_BUILD_NUMBER}
      - kubectl -n zkme-test rollout status deployment/credbridge-go --timeout=600s
    when:
      ref:
        - refs/heads/branch_test

---
kind: secret
name: sgx-signing-key
get:
  path: sgx-signing-key
  name: key

---
kind: secret
name: docker-hub-username
get:
  path: docker-secret-hub.bitkinetic.com
  name: username

---
kind: secret
name: docker-hub-password
get:
  path: docker-secret-hub.bitkinetic.com
  name: password

---
kind: secret
name: kube-config
get:
  path: drone-helm-secret
  name: config

---
kind: secret
name: privy-app-id
get:
  path: credbridge-privy
  name: PRIVY_APP_ID

---
kind: secret
name: privy-app-secret
get:
  path: credbridge-privy
  name: PRIVY_APP_SECRET

---
kind: secret
name: PRIVY_APP_ID
get:
  path: credbridge-privy
  name: PRIVY_APP_ID

---
kind: secret
name: PRIVY_APP_SECRET
get:
  path: credbridge-privy
  name: PRIVY_APP_SECRET
