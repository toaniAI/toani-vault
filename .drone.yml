kind: pipeline
type: docker
name: backend-testing

trigger:
  ref:
    include:
      - refs/heads/branch_dev
      - refs/heads/branch_test
  event:
    # 临时禁用：使用 cron 事件触发，避免正常 push/PR 自动运行
    # 需要恢复时把 event 改回 push/pull_request
    - cron
  paths:
    exclude:
      - frontend/**

services:
  - name: redis
    image: redis:7-alpine
    ports:
      - 6379

steps:
  - name: cargo-fetch
    image: rust:1.88.0-slim-bookworm
    pull: if-not-exists
    commands:
      - apt-get update && apt-get install -y libssl-dev pkg-config protobuf-compiler libsodium-dev cmake build-essential
      - cargo fetch

  - name: rust-fmt
    image: rust:1.88.0-slim-bookworm
    pull: if-not-exists
    depends_on:
      - cargo-fetch
    commands:
      - apt-get update && apt-get install -y libssl-dev pkg-config protobuf-compiler libsodium-dev cmake build-essential
      - rustup component add rustfmt
      - cargo fmt --all -- --check

  - name: rust-clippy
    image: rust:1.88.0-slim-bookworm
    pull: if-not-exists
    depends_on:
      - cargo-fetch
    commands:
      - apt-get update && apt-get install -y libssl-dev pkg-config protobuf-compiler libsodium-dev cmake build-essential
      - rustup component add clippy
      - cargo clippy --tests -- -D warnings

  - name: unit-tests
    image: rust:1.88.0-slim-bookworm
    pull: if-not-exists
    depends_on:
      - rust-fmt
      - rust-clippy
    environment:
      REDIS_URL: redis://redis:6379
    commands:
      - apt-get update && apt-get install -y libssl-dev pkg-config protobuf-compiler libsodium-dev cmake build-essential
      - cargo test

---
kind: pipeline
type: docker
name: backend-build-deploy
trigger:
  ref:
    - refs/heads/branch_dev
    - refs/heads/branch_test
    - refs/tags/*
  event:
    - push
    - tag
  paths:
    exclude:
      - frontend/**

steps:
  - name: docker-build
    image: plugins/docker
    pull: if-not-exists
    settings:
      registry: hub.bitkinetic.com
      repo: hub.bitkinetic.com/zkme/credbridge
      tags: alpha-${DRONE_BUILD_NUMBER}
      purge: true
      username:
        from_secret: docker-hub-username
      password:
        from_secret: docker-hub-password
      context: ./
      dockerfile: Dockerfile
    when:
      ref:
        - refs/heads/branch_dev
        - refs/heads/branch_test

  - name: deploy-dev
    image: tttlkkkl/drone-helm:v6
    pull: if-not-exists
    depends_on:
      - docker-build
    environment:
      KUBECTL_CONFIG:
        from_secret: kube-config
      REPO_USER:
        from_secret: docker-hub-username
      REPO_PWD:
        from_secret: docker-hub-password
    commands:
      - /run.sh
      - helm repo add --username=$REPO_USER --password=$REPO_PWD dn https://charts.bitkinetic.com/
      - kubectl create --save-config configmap credbridge-go -n zkme-dev --from-file config/dev/config.yaml -o yaml --dry-run=client | kubectl apply -f -
      - helm upgrade --install credbridge-go dn/go -f .values.yaml -n zkme-dev --set image.tag=alpha-${DRONE_BUILD_NUMBER}
      - kubectl -n zkme-dev rollout status deployment/credbridge-go --timeout=600s
    when:
      ref:
        - refs/heads/branch_dev

  - name: deploy-test
    image: tttlkkkl/drone-helm:v6
    pull: if-not-exists
    depends_on:
      - docker-build
    environment:
      KUBECTL_CONFIG:
        from_secret: kube-config
      REPO_USER:
        from_secret: docker-hub-username
      REPO_PWD:
        from_secret: docker-hub-password
    commands:
      - /run.sh
      - helm repo add --username=$REPO_USER --password=$REPO_PWD dn https://charts.bitkinetic.com/
      - kubectl create --save-config configmap credbridge-go -n zkme-test --from-file config/test/config.yaml -o yaml --dry-run=client | kubectl apply -f -
      - helm upgrade --install credbridge-go dn/go -f .test.values.yaml -n zkme-test --set image.tag=alpha-${DRONE_BUILD_NUMBER}
      - kubectl -n zkme-test rollout status deployment/credbridge-go --timeout=600s
    when:
      ref:
        - refs/heads/branch_test

  - name: docker-build-pd
    image: plugins/docker
    pull: if-not-exists
    settings:
      registry: hub.bitkinetic.com
      repo: hub.bitkinetic.com/zkme/credbridge
      tags: ${DRONE_TAG}
      purge: true
      username:
        from_secret: docker-hub-username
      password:
        from_secret: docker-hub-password
      context: ./
      dockerfile: Dockerfile
    when:
      ref:
        - refs/tags/*

  - name: apply push to online
    image: hub.bitkinetic.com/public/deploy:v1
    pull: if-not-exists
    depends_on:
      - docker-build-pd
    environment:
      DEPLOY_AUTH_KEY:
        from_secret: deploy-auth-key
      DEPLOY_SERVER:
        from_secret: deploy-base-url
      OBJECT: zkme
    commands:
      - app call -d
    when:
      ref:
        - refs/tags/*

---
kind: secret
name: docker-hub-username
get:
  path: docker-secret-hub.bitkinetic.com
  name: username

---
kind: secret
name: docker-hub-password
get:
  path: docker-secret-hub.bitkinetic.com
  name: password

---
kind: secret
name: kube-config
get:
  path: drone-helm-secret
  name: config

---
kind: secret
name: deploy-auth-key
get:
  path: drone-deploy-auth-key
  name: auth-key

---
kind: secret
name: deploy-base-url
get:
  path: drone-deploy-auth-key
  name: deploy-base-url
