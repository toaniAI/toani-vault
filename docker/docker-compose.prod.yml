# CredBridge - Docker Compose 生产环境配置
# 生产环境配置：安全加固、资源限制、高可用性
#
# 使用方式:
#   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# 或者设置环境变量:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml docker-compose up -d

version: "3.9"

services:
  # ============================================================================
  # Vault Service - 生产环境配置
  # ============================================================================
  vault-service:
    # 使用预构建镜像而非本地构建
    image: credbridge/vault-service:${VAULT_SERVICE_VERSION:-latest}
    restart: always
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "1.0"
          memory: 1G
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
        failure_action: pause
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
    environment:
      # 生产环境配置
      - VAULT_SERVICE_ENV=production
      - RUST_LOG=info
      - RUST_BACKTRACE=0

      # Privy 配置（显式注入，允许通过 .env 或宿主环境明文传入）
      - PRIVY_APP_ID=${PRIVY_APP_ID:-}
      - PRIVY_APP_SECRET=${PRIVY_APP_SECRET:-}
      - PRIVY_JWKS_URL=${PRIVY_JWKS_URL:-}
      - PRIVY_API_URL=${PRIVY_API_URL:-https://auth.privy.io/api/v1}
      - PRIVY_MOCK_ENABLED=${PRIVY_MOCK_ENABLED:-false}

      # 数据库连接池配置
      - DATABASE_MAX_CONNECTIONS=20
      - DATABASE_MIN_CONNECTIONS=5
      - DATABASE_CONNECT_TIMEOUT=10
      - DATABASE_IDLE_TIMEOUT=300

      # Redis 集群配置
      - REDIS_CLUSTER_ENABLED=true
      - REDIS_SENTINEL_ENABLED=true
      - REDIS_SENTINEL_HOSTS=redis-sentinel:26379
      - REDIS_SENTINEL_MASTER_NAME=mymaster

      # immudb 高可用配置
      - IMMUDB_REPLICA_ENABLED=true
      - IMMUDB_REPLICA_ADDRESS=immudb-replica:3322

      # TEE 生产模式
      - TEE_MODE=hardware
      - TEE_DEBUG=false
      - SEALED_STORAGE_PATH=/app/data/sealed
      - TEE_INTEL_SGX_ENABLED=true

      # 安全头部
      - SECURITY_HSTS_ENABLED=true
      - SECURITY_CSP_ENABLED=true

      # 速率限制
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_REQUESTS_PER_SECOND=100
      - RATE_LIMIT_BURST_SIZE=150

    # 生产环境端口映射（使用反向代理）
    ports:
      - "127.0.0.1:8080:8080"

    # 安全选项
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /app/tmp:noexec,nosuid,size=100m

    # 只读根文件系统，仅挂载必要卷
    volumes:
      - type: volume
        source: vault_data
        target: /app/data
        read_only: false
      - type: volume
        source: vault_logs
        target: /app/logs
        read_only: false
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 100M
          mode: 1777

    # 健康检查（更严格）
    healthcheck:
      test: ["/app/healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service,environment"
        env: "VAULT_SERVICE_ENV"

  # ============================================================================
  # PostgreSQL - 生产环境配置
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 2G
    environment:
      - POSTGRES_USER=${DB_USER:-credbridge}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-credbridge}
      - PGDATA=/var/lib/postgresql/data/pgdata

      # PostgreSQL 性能调优
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
      - POSTGRES_HOST_AUTH_METHOD=scram-sha-256

    # 使用 .env 文件或 secrets 管理密码
    secrets:
      - db_password
      - db_root_password

    # 性能和安全配置
    shm_size: 1g
    security_opt:
      - no-new-privileges:true

    # 生产环境持久化（使用命名卷或外部存储）
    volumes:
      - type: volume
        source: postgres_data_prod
        target: /var/lib/postgresql/data
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
      - type: bind
        source: ./config/postgres/postgresql.prod.conf
        target: /etc/postgresql/postgresql.conf
        read_only: true

    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf
      -c ssl=on
      -c ssl_cert_file=/etc/ssl/certs/server.crt
      -c ssl_key_file=/etc/ssl/private/server.key
      -c password_encryption=scram-sha-256

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # ============================================================================
  # Redis - 生产环境配置（主从 + 哨兵）
  # ============================================================================
  redis:
    image: redis:7-alpine
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
      --maxmemory 768mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
      --bind 0.0.0.0
      --protected-mode yes
      --tcp-keepalive 60
      --timeout 300

    security_opt:
      - no-new-privileges:true

    volumes:
      - type: volume
        source: redis_data_prod
        target: /data
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true

    sysctls:
      - net.core.somaxconn=65535

    healthcheck:
      test:
        ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--raw", "incr", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ============================================================================
  # Redis Sentinel - 高可用
  # ============================================================================
  redis-sentinel:
    image: redis:7-alpine
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    command: >
      redis-sentinel
      /etc/redis/sentinel.conf
      --sentinel announce-ip redis-sentinel

    volumes:
      - type: bind
        source: ./config/redis/sentinel.conf
        target: /etc/redis/sentinel.conf
        read_only: true

    depends_on:
      - redis

    ports:
      - "26379:26379"

    profiles:
      - ha

  # ============================================================================
  # immudb - 生产环境配置
  # ============================================================================
  immudb:
    image: codenotary/immudb:latest
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 2G
    environment:
      - IMMUDB_ADDRESS=0.0.0.0
      - IMMUDB_PORT=3322
      - IMMUDB_PGSQL_SERVER_ENABLED=true
      - IMMUDB_PGSQL_SERVER_PORT=5433
      - IMMUDB_WEBSERVER_ENABLED=false
      - IMMUDB_MAINTENANCE=false
      - IMMUDB_AUTH=true

    security_opt:
      - no-new-privileges:true

    volumes:
      - type: volume
        source: immudb_data_prod
        target: /var/lib/immudb
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
      - type: bind
        source: ./config/immudb/immudb.toml
        target: /etc/immudb/immudb.toml
        read_only: true

    healthcheck:
      test: ["CMD", "/app/immudb", "version"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # ============================================================================
  # HashiCorp Vault - 生产环境配置
  # ============================================================================
  vault:
    image: hashicorp/vault:1.15
    restart: always
    cap_add:
      - IPC_LOCK
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    environment:
      - VAULT_ADDR=http://0.0.0.0:8200
      - VAULT_API_ADDR=http://vault:8200
      - VAULT_CLUSTER_ADDR=https://vault:8201

    security_opt:
      - no-new-privileges:true

    volumes:
      - type: volume
        source: vault_secrets_prod
        target: /vault/file
      - type: bind
        source: ./config/vault/vault.prod.hcl
        target: /vault/config/vault.hcl
        read_only: true
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true

    command: >
      vault server -config=/vault/config/vault.hcl

    healthcheck:
      test: ["CMD", "vault", "status", "-tls-skip-verify"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ============================================================================
  # Nginx - 反向代理和负载均衡
  # ============================================================================
  nginx:
    image: nginx:alpine
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - type: bind
        source: ./config/nginx/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
      - type: bind
        source: ./config/nginx/ssl
        target: /etc/nginx/ssl
        read_only: true
      - type: bind
        source: ./config/nginx/conf.d
        target: /etc/nginx/conf.d
        read_only: true
    depends_on:
      - vault-service
    networks:
      - credbridge_network
    profiles:
      - with-proxy

  # ============================================================================
  # Certbot - SSL 证书自动更新
  # ============================================================================
  certbot:
    image: certbot/certbot:latest
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    volumes:
      - type: bind
        source: ./data/certbot/conf
        target: /etc/letsencrypt
      - type: bind
        source: ./data/certbot/www
        target: /var/www/certbot
    profiles:
      - with-ssl

# =============================================================================
# 生产环境数据卷
# =============================================================================
volumes:
  vault_data_prod:
    driver: local
  vault_logs:
    driver: local
  postgres_data_prod:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/credbridge/postgres
  redis_data_prod:
    driver: local
  immudb_data_prod:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/credbridge/immudb
  vault_secrets_prod:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/credbridge/vault

# =============================================================================
# Docker Secrets（生产环境密码管理）
# =============================================================================
secrets:
  db_password:
    external: true
  db_root_password:
    external: true

# =============================================================================
# 网络配置（生产环境）
# =============================================================================
networks:
  credbridge_network:
    driver: bridge
    internal: false
    ipam:
      config:
        - subnet: 172.20.0.0/16
    driver_opts:
      com.docker.network.bridge.name: credbridge0
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
