openapi: 3.0.3
info:
  title: CredBridge Sandbox API (Broker-Only)
  version: 2.0.0
  description: |
    TEE sandbox public contract after Slice 4.
    Public sandbox surface is broker-only.
servers:
  - url: https://api.credbridge.example.com/api/v1
    description: Production server
  - url: https://api-staging.credbridge.example.com/api/v1
    description: Staging server
  - url: http://localhost:8080/api/v1
    description: Local development

tags:
  - name: Sandbox Broker
    description: Broker request submission and detail retrieval

paths:
  /sandbox/http-requests:
    post:
      summary: Submit sandbox broker request
      operationId: submitSandboxHttpRequest
      tags: [Sandbox Broker]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteOperationRequest'
      responses:
        '200':
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecuteOperationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /sandbox/http-requests/{operation_id}:
    get:
      summary: Get sandbox broker request detail
      operationId: getSandboxHttpRequestDetail
      tags: [Sandbox Broker]
      security:
        - bearerAuth: []
      parameters:
        - name: operation_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Request detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: PASETO

  schemas:
    ExecuteOperationRequest:
      type: object
      required:
        - operation_type
      properties:
        operation_type:
          type: string
          example: http_request
        description:
          type: string
          example: Fetch account balances
        parameters:
          type: object
          additionalProperties: true

    ExecuteOperationResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            operation_id:
              type: string
            success:
              type: boolean
            status:
              type: string
            error:
              type: string
              nullable: true

    OperationDetailResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            operation_id:
              type: string
            operation_type:
              type: string
            status:
              type: string
            started_at:
              type: string
              format: date-time
            completed_at:
              type: string
              format: date-time
              nullable: true

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
        message:
          type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
