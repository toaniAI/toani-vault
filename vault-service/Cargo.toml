[package]
name = "vault-service"
version = "0.1.0"
edition = "2024"

[dependencies]
# 异步运行时
tokio = { version = "1", features = ["full", "rt-multi-thread"] }

# HTTP 框架
axum = { version = "0.7", features = ["json", "macros"] }
http = "1.0"

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Base64 编码
base64 = "0.22"

# 错误处理
thiserror = "1.0"

# 日志
tracing = "0.1"

# UUID
uuid = { version = "1.7", features = ["v4", "serde"] }

# HTTP 客户端（用于 Webhook）
reqwest = { version = "0.12", features = ["json"], optional = true }

[dev-dependencies]
tokio-test = "0.4"

[features]
default = ["webhook"]
webhook = ["reqwest"]
