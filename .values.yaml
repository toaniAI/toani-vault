replicaCount: 1

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

image:
  repository: hub.bitkinetic.com/zkme/credbridge
  tag: stable
  pullPolicy: IfNotPresent

imagePullSecrets: []

command:
  - /app/runtime-preflight.sh
args:
  - /app/vault-service

envs:
  CREDBRIDGE_HOST: 0.0.0.0
  CREDBRIDGE_PORT: "8080"
  CREDBRIDGE_ENV: development
  SANDBOX_OWNER_HEADLESS_SERVICE: "credbridge-go-owner"
  SANDBOX_OWNER_PORT: "8080"
  CREDBRIDGE_AUDIT_ALLOW_MEMORY_FALLBACK: "true"
  # Dev runs without production DCAP quote materialization, so use simulation
  # attestation semantics to keep /ready focused on deployable dependencies.
  TEE_MODE: simulation
  TEE_DEBUG: "true"
  TEE_ENCLAVE_PATH: /app/credbridge_enclave.signed.so
  SEALED_STORAGE_PATH: /app/data/sealed
  RUST_LOG: debug
  DATABASE_URL: "postgresql://dn:dnXcdYxcv56H@postgresql-hl.dev:5432/credbridge?sslmode=disable"
  REDIS_URL: "redis://:Ysdn2025G0217@redis74-master.test.svc.cluster.local:6379/0"
  CREDBRIDGE_PG_SCHEMA: "credbridge_vault"
  VAULT_ADDR: "http://vault:8200"
  DCAP_PCCS_URL: "https://sgx-dcap-server-vpc.cn-hongkong.aliyuncs.com/sgx/certification/v4/"
  DCAP_USE_SECURE_CERT: "true"
  DCAP_COLLATERAL_SERVICE: "https://api.trustedservices.intel.com/sgx/certification/v4/"
  DCAP_PCCS_API_VERSION: "3.1"
  # Optional plaintext fallback for CI/CD when Drone secrets are unavailable.
  # Prefer Drone secrets in production; these values are committed to git if filled in here.
  PRIVY_APP_ID: "cmniaifov006t0cl1af6l5xqs"
  PRIVY_APP_SECRET: "privy_app_secret_51xduL8UX9MyuZDEizgyhhh9MXsAQsZbW5n9T1xBTdrT1fgcYDqK64Yv4Cnefyhirjx94sctJPzNyAFqyVJ2GH73"
  # nsjail smoke test 使用的 outside uid/gid，需与镜像内 /etc/subuid(gid) 的授权范围一致
  # 镜像内配置为 root:100000:65536，故设为 100000
  CREDBRIDGE_NSJAIL_OUTSIDE_UID: "100000"
  CREDBRIDGE_NSJAIL_OUTSIDE_GID: "100000"

o_envs:
  - name: SANDBOX_OWNER_ID
    valueFrom:
      fieldRef:
        fieldPath: metadata.name
  - name: POD_NAMESPACE
    valueFrom:
      fieldRef:
        fieldPath: metadata.namespace

enableNfsLogPvc: false
consoleLogToFile: false

service:
  type: ClusterIP

ports:
  - name: http
    port: 8080
    protocol: TCP

healths:
  livenessProbe:
    httpGet:
      port: http
      path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readinessProbe:
    httpGet:
      port: http
      path: /ready
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3

# Explicit workload lifecycle settings. The upstream dn/go chart owns the
# Deployment; scripts/apply-sandbox-owner-headless-service.sh patches these
# fields after helm upgrade when the chart version does not render them.
terminationGracePeriodSeconds: 45
lifecycle:
  preStop:
    exec:
      command:
        - /bin/sh
        - -c
        - sleep 20

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

securityContext:
  privileged: true

volumes:
  - name: aesmd-socket
    hostPath:
      path: /var/run/aesmd
      type: Directory
volumeMounts:
  - name: aesmd-socket
    mountPath: /var/run/aesmd

configs: {}
configPath: /configs/
configExist: "credbridge"

nodeSelector:
  tee: tee
