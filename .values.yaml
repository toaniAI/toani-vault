replicaCount: 1

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

image:
  repository: hub.bitkinetic.com/zkme/credbridge
  tag: stable
  pullPolicy: IfNotPresent

imagePullSecrets: []

command:
  - /app/vault-service
args: []

envs:
  CREDBRIDGE_HOST: 0.0.0.0
  CREDBRIDGE_PORT: "8080"
  CREDBRIDGE_ENV: development
  TEE_MODE: simulation
  RUST_LOG: debug
  DATABASE_URL: "postgresql://dn:dnXcdYxcv56H@10.11.25.9:15432/credbridge"
  VAULT_ADDR: "http://vault:8200"

o_envs: []

enableNfsLogPvc: false
consoleLogToFile: false

service:
  type: ClusterIP

ports:
  - name: http
    port: 8080
    protocol: TCP

healths:
  livenessProbe:
    httpGet:
      port: http
      path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      port: http
      path: /health
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 3

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

configs: {}
configPath: /configs/
configExist: "credbridge-go"

nodeSelector:
  tee: tee
