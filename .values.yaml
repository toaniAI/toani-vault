# CredBridge Backend Values - Dev Environment
# Chart: dn/go
# Service: credbridge-backend

replicaCount: 1

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

image:
  repository: hub.bitkinetic.com/suna/credbridge-backend
  tag: stable
  pullPolicy: IfNotPresent

imagePullSecrets: []

# 启动命令 - Rust 二进制直接使用
command:
  - /app/credbridge
args: []

# 环境变量
envs:
  RUST_LOG: info
  CONFIG_FILE_PATH: /configs/config.yaml
  PORT: "8080"

o_envs: []

enableNfsLogPvc: false
consoleLogToFile: false

service:
  type: ClusterIP

ports:
  - name: http
    port: 8080
    protocol: TCP
  - name: metrics
    port: 9090
    protocol: TCP

# 健康检查 - HTTP 方式
healths:
  livenessProbe:
    httpGet:
      port: http
      path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      port: http
      path: /health
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 3

# 资源配置 (可根据需要调整)
resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# 配置挂载
configs: {}
configPath: /configs/
configExist: "credbridge-backend"

nodeSelector: {}
