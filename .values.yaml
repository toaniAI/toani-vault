replicaCount: 1

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

image:
  repository: hub.bitkinetic.com/zkme/credbridge
  tag: stable
  pullPolicy: IfNotPresent

imagePullSecrets: []

command:
  - /app/runtime-preflight.sh
args:
  - /app/vault-service

envs:
  CREDBRIDGE_HOST: 0.0.0.0
  CREDBRIDGE_PORT: "8080"
  CREDBRIDGE_ENV: development
  CREDBRIDGE_AUDIT_ALLOW_MEMORY_FALLBACK: "true"
  TEE_MODE: hardware
  TEE_ENCLAVE_PATH: /app/credbridge_enclave.signed.so
  SEALED_STORAGE_PATH: /app/data/sealed
  RUST_LOG: debug
  DATABASE_URL: "postgresql://dn:dnXcdYxcv56H@postgresql-hl.dev:5432/credbridge?sslmode=disable"
  CREDBRIDGE_PG_SCHEMA: "credbridge_vault"
  VAULT_ADDR: "http://vault:8200"
  DCAP_PCCS_URL: "https://sgx-dcap-server-vpc.cn-hongkong.aliyuncs.com/sgx/certification/v4/"
  DCAP_USE_SECURE_CERT: "true"
  DCAP_COLLATERAL_SERVICE: "https://api.trustedservices.intel.com/sgx/certification/v4/"
  DCAP_PCCS_API_VERSION: "3.1"

o_envs: []

enableNfsLogPvc: false
consoleLogToFile: false

service:
  type: ClusterIP

ports:
  - name: http
    port: 8080
    protocol: TCP

healths:
  livenessProbe:
    httpGet:
      port: http
      path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      port: http
      path: /health
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 3

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

securityContext:
  privileged: true

volumes:
  - name: aesmd-socket
    hostPath:
      path: /var/run/aesmd
      type: Directory
volumeMounts:
  - name: aesmd-socket
    mountPath: /var/run/aesmd

configs: {}
configPath: /configs/
configExist: "credbridge"

nodeSelector:
  tee: tee
