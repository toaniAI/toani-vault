[package]
name = "credbridge-mcp-server"
version = "0.1.0"
edition = "2024"
description = "CredBridge MCP Server - AI Agent 凭证管理接口"
authors = ["CredBridge Team"]
license = "MIT OR Apache-2.0"

[dependencies]
# 内部依赖
vault-service = { path = ".." }

# MCP 协议实现
# 使用 rmcp 作为 MCP 协议实现（社区最活跃的 Rust MCP 实现）
rmcp = { version = "0.4", features = ["server", "macros", "transport-io"] }

# 异步运行时
tokio = { version = "1", features = ["full", "rt-multi-thread"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 错误处理
thiserror = "1.0"
anyhow = "1.0"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP/Web 服务器（用于 SSE 传输）
axum = { version = "0.7", features = ["json", "macros"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# 流处理（用于 SSE）
futures = "0.3"
tokio-stream = "0.1"

# 工具
uuid = { version = "1.7", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# 配置
config = "0.14"

# 随机数生成
rand = "0.8"

# Base64 编码
base64 = "0.22"

# 安全内存清除
zeroize = { version = "1.7", features = ["derive"] }

# Async trait
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
