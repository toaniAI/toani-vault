replicaCount: 2

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

image:
  repository: hub.bitkinetic.com/zkme/credbridge
  tag: stable
  pullPolicy: IfNotPresent

imagePullSecrets: []

command:
  - /app/runtime-preflight.sh
args:
  - /app/vault-service

envs:
  CREDBRIDGE_HOST: 0.0.0.0
  CREDBRIDGE_PORT: "8080"
  CREDBRIDGE_ENV: production
  SEALED_STORAGE_PATH: /app/data/sealed
  RUST_LOG: info
  DATABASE_URL: "postgresql://dn:CHANGE_ME_DB_PASSWORD@localhost:5432/credbridge"
  REDIS_URL: "redis://:Ysdn2025G0217@redis74-master.test.svc.cluster.local:6379/0"
  VAULT_ADDR: "http://vault:8200"
  # Optional plaintext fallback for CI/CD when Drone secrets are unavailable.
  # Prefer Drone secrets in production; these values are committed to git if filled in here.
  PRIVY_APP_ID: "cmniaifov006t0cl1af6l5xqs"
  PRIVY_APP_SECRET: "privy_app_secret_51xduL8UX9MyuZDEizgyhhh9MXsAQsZbW5n9T1xBTdrT1fgcYDqK64Yv4Cnefyhirjx94sctJPzNyAFqyVJ2GH73"

o_envs: []

enableNfsLogPvc: false
consoleLogToFile: false

service:
  type: ClusterIP

ports:
  - name: http
    port: 8080
    protocol: TCP

healths:
  livenessProbe:
    httpGet:
      port: http
      path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      port: http
      path: /health
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 3

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

configs: {}
configPath: /configs/
configExist: "credbridge"

nodeSelector:
  tee: tee
