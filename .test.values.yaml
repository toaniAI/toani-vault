replicaCount: 2

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

image:
  repository: registry.example.com/example-org/credbridge
  tag: test-latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

command:
  - /app/runtime-preflight.sh
args:
  - /app/vault-service

envs:
  CREDBRIDGE_HOST: 0.0.0.0
  CREDBRIDGE_PORT: "8080"
  CREDBRIDGE_ENV: production
  SANDBOX_OWNER_HEADLESS_SERVICE: "credbridge-owner"
  SANDBOX_OWNER_PORT: "8080"
  TEE_MODE: hardware
  SEALED_STORAGE_PATH: /app/data/sealed
  RUST_LOG: info
  DATABASE_URL: "postgresql://username:password@db.example.com:5432/credbridge"
  REDIS_URL: "redis://:password@redis.example.com:6379/0"
  VAULT_ADDR: "https://vault.example.com"
  # Optional plaintext fallback for CI/CD when Drone secrets are unavailable.
  # Prefer Drone secrets in production; these values are committed to git if filled in here.
  PRIVY_APP_ID: "replace-with-your-privy-app-id"
  PRIVY_APP_SECRET: "replace-with-your-secret"

o_envs:
  - name: SANDBOX_OWNER_ID
    valueFrom:
      fieldRef:
        fieldPath: metadata.name
  - name: POD_NAMESPACE
    valueFrom:
      fieldRef:
        fieldPath: metadata.namespace

enableNfsLogPvc: false
consoleLogToFile: false

service:
  type: ClusterIP

ports:
  - name: http
    port: 8080
    protocol: TCP

healths:
  livenessProbe:
    httpGet:
      port: http
      path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readinessProbe:
    httpGet:
      port: http
      path: /ready
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3

# Explicit workload lifecycle settings. The upstream dn/go chart owns the
# Deployment; scripts/apply-sandbox-owner-headless-service.sh patches these
# fields after helm upgrade when the chart version does not render them.
terminationGracePeriodSeconds: 45
lifecycle:
  preStop:
    exec:
      command:
        - /bin/sh
        - -c
        - sleep 20

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

configs: {}
configPath: /configs/
configExist: "credbridge"

nodeSelector:
  tee: tee
