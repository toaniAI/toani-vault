redis:
  url: "redis://:devredis@4y93j3Usi@dev-r-n9ehhd6lin7zi5x0jwpd.redis.rds.aliyuncs.com:6379/3"
  pool_size: 10

# Vault 配置 (本地开发使用模拟或本地 Vault)
vault:
  addr: "http://localhost:8200"
  token: "root"
  kv_path: "secret/local"

# 日志配置
log:
  level: "debug"
  format: "json"

# 安全配置 (本地开发使用固定值)
security:
  jwt_secret: "local-jwt-secret-for-development-only-change-in-production"
  token_expiry: 3600
  encryption_key: "local-encryption-key-32bytes-for-dev"

# CORS 配置
cors:
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"

# API 限流
rate_limit:
  requests_per_minute: 1000
  burst: 100
