# CredBridge HK Production Configuration
# 从 Vault 读取的机密用 ${VAR_NAME} 占位符表示
# 服务启动前会被替换为实际值

server:
  host: "0.0.0.0"
  port: 8080

# 数据库配置 - 从 Vault 读取
database:
  url: "${DATABASE_URL}"
  pool_size: 50
  timeout_seconds: 30

# Redis 缓存 - 从 Vault 读取
redis:
  url: "${REDIS_URL}"
  pool_size: 50

# Vault 配置
vault:
  addr: "https://vault.example.com"
  token: "${VAULT_TOKEN}"
  kv_path: "secret/prod"

# 日志配置
log:
  level: "warn"
  format: "json"

# 安全配置 - 从 Vault 读取
security:
  jwt_secret: "${JWT_SECRET}"
  token_expiry: 7200
  encryption_key: "${ENCRYPTION_KEY}"

# CORS 配置 - 生产环境
cors:
  allowed_origins:
    - "https://credbridge.example.com"
    - "https://admin.credbridge.example.com"

# API 限流
rate_limit:
  requests_per_minute: 10000
  burst: 100

# 监控配置
metrics:
  enabled: true
  port: 9090
  path: "/metrics"
