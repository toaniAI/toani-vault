# 默认 values - 会被环境 specific values 覆盖
project:
  name: credbridge
  server: credbridge-backend

environment: dev
namespace: suna
cluster: hk

# Vault 配置 - 生产环境从 Vault 读取机密
vault:
  enabled: true
  address: "https://vault.example.com"
  path: "secret/data/credbridge"
  secrets:
    keys:
      - DATABASE_URL
      - REDIS_URL
      - VAULT_TOKEN
      - JWT_SECRET
      - ENCRYPTION_KEY

# External Secrets 配置
externalSecrets:
  enabled: true
  refreshInterval: "1h"
