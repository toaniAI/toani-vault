# Default values for credbridge.
# This is a YAML-formatted file.
# ================================================
# 注意: 以下是必须保留的，不要删除。以下是应用配置，自由发挥。对应configmap的配置。
# 注意：想从 valu推读取的机密数据要使用大写 shell 变量标记，如：${REDIS_USERNAME}，它将在服务启动前一刻完成替换。
# ================================================
# Project configuration
project:
  name: zkme             # 项目名称
  server: credbridge             # 服务名称

# Environment configuration
environment: dev
# Kubernetes namespace
namespace: dev
# current cluster
cluster: ""

# Vault configuration for External Secrets
vault:
  enabled: true
  address: "http://vault.vault.svc.cluster.local:8200"
  auth:
    appRole:
      # AppRole credentials will be provided by ArgoCD as external secrets or injected during deployment
      roleId: ""  # Set by ArgoCD or CI/CD environment values
      secretId: ""  # Set by ArgoCD or CI/CD, only used if creating secret via template
      mountPath: "approle"
      secretRef:
        # custom example-vault-auth name
        name: ""
        key: "secretId"
  secrets:
    # 全局基础路径，作为默认路径，支持变量模板
    basePath: "secret/projects/{{ .Values.project.name }}/common/{{ .Values.environment }}"
    # 使用通用的 external-secrets: vault-common-prod
    keys: []

# External Secrets configuration
externalSecrets:
  existing: vault-common-prod
  enabled: false
  refreshInterval: "1h"
  # SecretStore configuration
  secretStore:
    # 是否创建新的SecretStore，如果为false则使用已存在的
    create: false
    # 如果create=false，指定要引用的已存在SecretStore名称
    existingName: "vault-ops-read"
    # SecretStore的类型：SecretStore 或 ClusterSecretStore
    kind: "SecretStore"

# 配置处理器 - 从Secret文件读取机密值，替换配置中的占位符
configProcessor:
  # 是否启用配置处理器
  enabled: true

# Sandbox owner routing
sandboxOwnerRouting:
  enabled: true
  headlessServiceName: "credbridge-owner"
  portName: "http"
  port: 8080
  targetPort: "http"
  publishNotReadyAddresses: true
  scheme: "http"
  # Optional explicit selector labels for the workload behind the owner headless service.
  # Leave empty to fall back to the chart selector labels.
  selectorLabels: {}

# Runtime environment values consumed by the deployment chart that uses this values bundle.
envs:
  SANDBOX_OWNER_HEADLESS_SERVICE: "credbridge-owner"
  SANDBOX_OWNER_PORT: "8080"

# Raw env entries for charts that support direct Pod fieldRef injection.
o_envs:
  - name: SANDBOX_OWNER_ID
    valueFrom:
      fieldRef:
        fieldPath: metadata.name
  - name: POD_NAMESPACE
    valueFrom:
      fieldRef:
        fieldPath: metadata.namespace


# ================================================
# 注意: 以上是必须保留的，不要删除。以下是应用配置，自由发挥。对应configmap的配置。
# ================================================
# External services configuration templates
# Actual values will be injected from Vault via External Secrets
