# Environment-specific configuration
environment: prod
namespace: credbridge-prod
cluster: "replace-with-your-cluster"

# Project configuration
project:
  name: credbridge
  server: credbridge

sandboxOwnerRouting:
  enabled: true
  headlessServiceName: "credbridge-owner"
  portName: "http"
  port: 8080
  targetPort: "http"
  publishNotReadyAddresses: true

envs:
  SANDBOX_OWNER_HEADLESS_SERVICE: "credbridge-owner"
  SANDBOX_OWNER_PORT: "8080"

o_envs:
  - name: SANDBOX_OWNER_ID
    valueFrom:
      fieldRef:
        fieldPath: metadata.name
  - name: POD_NAMESPACE
    valueFrom:
      fieldRef:
        fieldPath: metadata.namespace
