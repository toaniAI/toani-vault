apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "credbridge.fullname" . }}
  labels:
    {{- include "credbridge.labels" . | nindent 4 }}
data:
  {{- if eq (tpl (required "need cluster flag" .Values.cluster) .) "hk" }}
  {{- range $path, $_ := .Files.Glob "config-hk/*" }}
  {{ base $path }}: |-
    {{- tpl ($.Files.Get $path) $ | nindent 4 }}
  {{- end }}
  {{- else if eq (tpl .Values.cluster .) "us" }}
  {{- range $path, $_ := .Files.Glob "config-us/*" }}
  {{ base $path }}: |-
    {{- tpl ($.Files.Get $path) $ | nindent 4 }}
  {{- end }}
  {{- end }}
