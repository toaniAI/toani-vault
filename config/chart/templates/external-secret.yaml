{{/*
ExternalSecret for Vault integration
从 Vault 拉取机密并在 Pod 中创建 Secret
*/}}
{{- if .Values.vault.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "credbridge-config.externalSecretName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "credbridge-config.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: {{ include "credbridge-config.fullname" . }}-secrets
    creationPolicy: Owner
  data:
  {{- range .Values.vault.secrets.keys }}
  - secretKey: {{ . }}
    remoteRef:
      key: {{ $.Values.vault.path }}
      property: {{ . | lower }}
  {{- end }}
{{- end }}
