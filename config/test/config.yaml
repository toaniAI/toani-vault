# CredBridge Test Environment Configuration
# 此配置文件通过 drone 部署时直接推送到集群

server:
  host: "0.0.0.0"
  port: 8080

# =============================================================================
# PostgreSQL 数据库配置 (K8s 集群内访问)
# 连接地址: postgres-timescale.dev.svc.cluster.local:5432
# Root: dev_root
# Password: 通过环境变量注入
# 建表参考: https://help.aliyun.com/zh/rds/apsaradb-rds-for-postgresql/use-the-timescaledb-extension
# =============================================================================
database:
  url: "postgres://dev_root:${DATABASE_PASSWORD}@postgres-timescale.dev.svc.cluster.local:5432/credbridge_test"
  pool_size: 20
  timeout_seconds: 30

# =============================================================================
# Redis 缓存配置 (K8s 集群内访问)
# 连接地址: redis.dev.svc.cluster.local:6379
# Database: 2
# =============================================================================
redis:
  url: "redis://:devredis@4y93j3Usi@redis.dev.svc.cluster.local:6379/3"
  pool_size: 20

# Vault 配置
vault:
  addr: "http://vault:8200"
  token: "${VAULT_TOKEN}"
  kv_path: "secret/test"

# 日志配置
log:
  level: "info"
  format: "json"

# 安全配置
security:
  jwt_secret: "${JWT_SECRET}"
  token_expiry: 3600
  encryption_key: "${ENCRYPTION_KEY}"

# CORS 配置
cors:
  allowed_origins:
    - "https://test.credbridge.local"
    - "https://credbridge-test.example.com"

# API 限流
rate_limit:
  requests_per_minute: 1000
  burst: 50
