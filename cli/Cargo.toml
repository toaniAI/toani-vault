[package]
name = "credbridge-cli"
version = "0.1.0"
edition = "2024"
authors = ["CredBridge Team"]
description = "Command line interface for CredBridge credential vault"
license = "MIT"
repository = "https://github.com/credbridge/credbridge"

[[bin]]
name = "credbridge"
path = "src/main.rs"

[dependencies]
# CLI 框架
clap = { version = "4.5", features = ["derive", "env", "cargo"] }

# CredBridge SDK
credbridge-sdk = { path = "../sdk-rust" }

# 异步运行时
tokio = { version = "1", features = ["full", "rt-multi-thread"] }

# 序列化/反序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# 输出格式化
comfy-table = "7.1"
colored = "2.1"

# 交互式提示
dialoguer = "0.11"
console = "0.15"

# 配置管理
dirs = "5.0"

# 错误处理
anyhow = "1.0"
thiserror = "2.0"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# URL 解析
url = "2.5"

# 时间处理
chrono = { version = "0.4", features = ["serde"] }
humantime = "2.1"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
